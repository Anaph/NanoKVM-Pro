name: Build

on:
  # No paths-ignore here: it applies to tag pushes too, and a release must never
  # be skipped because the tagged commit happened to touch only documentation.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/workflows/issue-tracker.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to package, e.g. 1.2.15+hid.1. Empty builds without packaging.'
        type: string
      publish:
        description: 'Publish the packaged release to GitHub Releases'
        type: boolean
        default: false

env:
  # Upstream release the nanokvm package is rebased onto: it supplies libkvm.so,
  # usbdev.sh and the kvmcomm/pikvm components, none of which are built here.
  BASE_RELEASE_VERSION: '1.2.15'
  # Flashable image the firmware is rebuilt from. build_image.py patches this
  # base rather than building a rootfs, so a published NanoKVM-Pro image is what
  # supplies the kernel, bootloaders and the Ubuntu userland.
  BASE_IMAGE_URL: 'https://github.com/sipeed/NanoKVM-Pro/releases/download/v1.0.15/20260529_NanoKVMPro_1_0_15.axp'

# A newer push to the same branch makes the previous build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # package.json declares no packageManager field, so the version is pinned
      # here to match web/pnpm-lock.yaml (lockfileVersion 9).
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # package.json requires ^20.19.0 || >=22.12.0.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs tsc before vite, so this type-checks as well.
      - name: Build
        working-directory: web
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist
          if-no-files-found: error

  server:
    name: Server (aarch64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # patchelf: build.sh sets the dl_lib rpath with it.
      # libopus-dev: `go vet` compiles the cgo packages for the host, so it
      # needs the host copy of opus/opus.h even though the build targets arm64.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf libopus-dev

      # ~500 MB from developer.arm.com, pinned by sha256 in config.ini, so key
      # the cache on that file.
      - name: Cache cross toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: support/toolchains
          key: toolchain-${{ runner.os }}-${{ hashFiles('support/scripts/config.ini') }}

      - name: Install cross toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: support/scripts
        run: ./toolchain_setup.sh

      # toolchain.ini records absolute paths, and build.sh additionally resolves
      # the compiler through `command -v`. Rewriting the file and exporting the
      # bin directory here keeps both correct whether the toolchain was just
      # installed or restored from a cache built in another workspace.
      - name: Point the build at the toolchain
        working-directory: support/scripts
        run: |
          set -euo pipefail
          name="$(python3 getconfig.py config.ini toolchain name)"
          dir="$(cd "../toolchains/${name}" && pwd)"

          {
            echo '[toolchain]'
            for key in cc cxx ld; do
              echo "${key} = ${dir}/$(python3 getconfig.py config.ini toolchain "${key}")"
            done
          } > ../toolchains/toolchain.ini

          cat ../toolchains/toolchain.ini
          echo "${dir}/bin" >> "$GITHUB_PATH"

      - name: Check formatting and vet
        working-directory: server
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...

      - name: Build
        working-directory: server
        run: ./build.sh

      - name: Verify target architecture
        working-directory: server
        run: |
          set -euo pipefail
          file NanoKVM-Server
          file NanoKVM-Server | grep -q 'ARM aarch64' || {
            echo 'built binary is not aarch64'
            exit 1
          }

      # dl_lib is deliberately absent from the artifact: kvmimpl.cpp is a
      # link-time stub whose every entry point aborts, which is why build.sh
      # deletes the .so it builds in an EXIT trap. The real libkvm.so lives on
      # the device, where the binary finds it through its $ORIGIN/dl_lib rpath.
      - name: Stage server tree
        run: |
          set -euo pipefail
          mkdir -p dist/server/edid
          cp server/NanoKVM-Server dist/server/
          # Bundled EDID profiles are read from an "edid" directory next to the
          # binary, see support/edid/README.md.
          cp support/edid/*.bin dist/server/edid/

      - uses: actions/upload-artifact@v4
        with:
          name: server-aarch64
          path: dist/server
          if-no-files-found: error

  edid:
    name: EDID profiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Fails if a committed .bin no longer matches its generator.
      - name: Verify committed blobs
        working-directory: support/edid
        run: python3 generate_edid.py --check

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [web, server]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-aarch64
          path: nanokvm-pro/server

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: nanokvm-pro/server/web

      # Mirrors the on-device layout: router.web() serves <dir of binary>/web,
      # and the bundled EDID profiles sit beside it.
      - name: Show layout
        run: find nanokvm-pro -maxdepth 3

      - uses: actions/upload-artifact@v4
        with:
          name: nanokvm-pro-app
          path: nanokvm-pro
          if-no-files-found: error

  release:
    name: Release package
    runs-on: ubuntu-latest
    needs: [web, server]
    # A tag build always packages; a manual run does so when given a version.
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: server-aarch64
          path: dist/server

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist/web

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Packaging ${version} on top of upstream ${BASE_RELEASE_VERSION}"

      - name: Build release package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x dist/server/NanoKVM-Server
          ./support/scripts/build_release.sh \
            --version "$VERSION" \
            --base-version "$BASE_RELEASE_VERSION" \
            --server dist/server/NanoKVM-Server \
            --web dist/web \
            --edid support/edid \
            --out dist/release

      # Guards against a package that silently lost our build: the binary has to
      # be the aarch64 one from this run, and the upstream pieces have to survive.
      - name: Verify package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          deb="dist/release/nanokvm_pro_${VERSION}/nanokvmpro_${VERSION}_arm64.deb"

          dpkg-deb -f "$deb"

          # Captured first: piping dpkg-deb straight into `grep -q` kills it
          # with SIGPIPE, which pipefail would report as a failed check.
          contents="$(dpkg-deb -c "$deb")"
          echo "$contents" | grep -q 'kvmapp/server/edid/LG-24BK550Y-B.bin'

          mkdir -p /tmp/verify
          dpkg-deb -x "$deb" /tmp/verify
          file /tmp/verify/kvmapp/server/NanoKVM-Server | grep -q 'ARM aarch64'
          cmp /tmp/verify/kvmapp/server/NanoKVM-Server dist/server/NanoKVM-Server
          test -f /tmp/verify/kvmapp/server/dl_lib/libkvm.so.0.1.0
          test -x /tmp/verify/kvmapp/scripts/usbdev.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/release/*.tar.gz
          if-no-files-found: error

  image:
    name: Firmware image
    runs-on: ubuntu-latest
    needs: [release]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The rootfs expands to several GB and is repacked alongside the original,
      # which does not fit next to the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install image tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils qemu-user-static binfmt-support rsync mtools xz-utils
          python3 -m pip install --quiet tqdm axp-tools

      # build_image.py chroots into the arm64 rootfs. Without a registered
      # handler the kernel cannot exec its binaries and chroot fails with
      # "Exec format error".
      - name: Register the aarch64 binfmt handler
        run: |
          set -euo pipefail
          sudo update-binfmts --enable qemu-aarch64 || true
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo 'qemu-aarch64 binfmt handler is not registered'
            exit 1
          fi
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist/release

      # Only the package this repository builds goes into the image. The base
      # image already carries kvmcomm and pikvm at the same versions, so
      # reinstalling them is a no-op that can only break the build: pikvm's
      # postinst runs pikvm_init.sh and systemctl, neither of which works in a
      # chroot without a running systemd.
      - name: Select the packages to install
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          tar xzf "dist/release/nanokvm_pro_${VERSION}.tar.gz" -C dist/release

          mkdir -p image-app
          cp "dist/release/nanokvm_pro_${VERSION}/nanokvmpro_${VERSION}_arm64.deb" image-app/
          cp "dist/release/nanokvm_pro_${VERSION}/nanokvmpro_${VERSION}.json" image-app/
          ls -la image-app

      - name: Download the base image
        run: |
          set -euo pipefail
          mkdir -p image
          curl -fL --retry 3 --retry-delay 5 -o "image/base.axp" "$BASE_IMAGE_URL"
          ls -la image/base.axp

      - name: Build the firmware image
        id: image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # Mirrors the upstream asset naming, e.g. 20260529_NanoKVMPro_1_0_15.axp
          name="$(date -u +%Y%m%d)_NanoKVMPro_$(echo "$VERSION" | tr '.+-' '_').axp"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

          # The overlay makes Logitech the default USB identity (files under
          # /boot that usbdev.sh reads) and installs the one-shot that applies
          # the LG EDID, so the attached host sees a Logitech receiver and an
          # LG monitor out of the box.
          python3 support/scripts/build_image/build_image.py \
            image/base.axp \
            --app image-app \
            --overlay support/scripts/image-overlay \
            -o "image/${name}"

          ls -la "image/${name}"
          df -h /

      # A repack that silently dropped the rootfs would still produce a zip, so
      # check the members the flashing tool needs are all present.
      - name: Verify the image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          python3 - "image/${IMAGE_NAME}" <<'PY'
          import sys, zipfile
          required = [
              "ubuntu_rootfs_sparse.ext4",
              "bootfs.fat32",
              "boot_signed.bin",
              "u-boot_signed.bin",
              "AX630C_emmc_arm64_k419_sipeed_nanokvm.xml",
          ]
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
              missing = [n for n in required if n not in names]
              if missing:
                  sys.exit(f"image is missing: {missing}")
              rootfs = z.getinfo("ubuntu_rootfs_sparse.ext4").file_size
              print(f"members: {len(names)}, rootfs: {rootfs / 2**30:.2f} GiB")
              if rootfs < 2 * 2**30:
                  sys.exit("rootfs looks truncated")
              z.extract("bootfs.fat32", "verify")
              z.extract("ubuntu_rootfs_sparse.ext4", "verify")
          PY

          # Default USB identity: Logitech files must be in /boot. mtools reads
          # the FAT image directly, so this needs no vfat mount.
          boot=verify/bootfs.fat32
          [ "$(mtype -i "$boot" ::usb.vid)" = "0x046d" ] || { echo "usb.vid wrong"; exit 1; }
          [ "$(mtype -i "$boot" ::usb.product)" = "USB Receiver" ] || { echo "usb.product wrong"; exit 1; }
          echo "boot: $(mtype -i "$boot" ::usb.manufacturer) $(mtype -i "$boot" ::usb.product) $(mtype -i "$boot" ::usb.vid):$(mtype -i "$boot" ::usb.pid)"

          # Default EDID: the one-shot and its enable symlink must be in the rootfs.
          simg2img verify/ubuntu_rootfs_sparse.ext4 verify/rootfs.ext4
          mkdir -p verify/mp
          sudo mount -o ro verify/rootfs.ext4 verify/mp
          test -x verify/mp/usr/local/sbin/nanokvm-default-edid.sh
          test -L verify/mp/etc/systemd/system/multi-user.target.wants/nanokvm-default-edid.service
          test -f verify/mp/kvmapp/server/edid/LG-24BK550Y-B.bin
          echo "rootfs: default-edid one-shot installed and enabled"
          sudo umount verify/mp

      # balenaEtcher (and dd) want a raw disk image, not the .axp container.
      # axp2img lays the partitions out per the image's XML and xz-compresses the
      # result, which balenaEtcher reads directly.
      - name: Convert to a flashable .img.xz
        id: img
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          # Free the inputs first: axp2img re-unpacks the .axp and expands the
          # rootfs, so the peak footprint is several GB on top of the image.
          rm -rf image/base.axp image-app verify

          img_xz="${IMAGE_NAME%.axp}.img.xz"
          echo "name=${img_xz}" >> "$GITHUB_OUTPUT"

          axp2img -i "image/${IMAGE_NAME}" -o "image/${img_xz}"
          ls -la "image/${img_xz}"
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-image
          path: |
            image/*.axp
            image/*.img.xz
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMG_XZ: ${{ steps.img.outputs.name }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${VERSION}"
          fi

          # Written to a file rather than passed inline: a heredoc cannot be
          # closed at this indentation level inside a YAML block scalar.
          {
            echo "Built by GitHub Actions from \`${GITHUB_SHA}\`."
            echo
            echo "### Flashing"
            echo
            echo "\`${IMG_XZ}\` is a raw disk image: flash it straight to the eMMC with"
            echo "balenaEtcher (it reads .xz directly) or \`xz -dc ${IMG_XZ} | sudo dd of=/dev/<device> bs=4M\`."
            echo "See the [Sipeed wiki](https://wiki.sipeed.com/hardware/en/kvm/NanoKVM_Pro/faq.html#Image-Burning-Methods) for how to enter flashing mode."
            echo
            echo "\`${IMAGE_NAME}\` is the same image in Sipeed's .axp container, for their own flashing tool."
            echo
            echo "### Updating an existing device"
            echo
            echo "\`nanokvm_pro_${VERSION}.tar.gz\` holds the same packages on their own, for installing"
            echo "over a running system without reflashing."
            echo
            echo "### Provenance"
            echo
            echo "The \`nanokvm\` package is built from this repository. The base image is upstream"
            echo "\`$(basename "$BASE_IMAGE_URL")\`, and \`kvmcomm\`, \`pikvm\` and the parts of \`nanokvm\` not built"
            echo "here (libkvm.so, usbdev.sh, the systemd units) come from upstream release ${BASE_RELEASE_VERSION}."
          } > release-notes.md

          # Makes a re-publish of the same version replace the old assets
          # instead of failing on an existing tag.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$tag" \
            "image/${IMG_XZ}" \
            "image/${IMAGE_NAME}" \
            "dist/release/nanokvm_pro_${VERSION}.tar.gz" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
